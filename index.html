<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Mutoscope</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #0c0906; overflow: hidden; }
    canvas { display: block; }
    #counter {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #5a4a30;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      user-select: none;
    }
    #ui {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: #3a2a18;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      user-select: none;
    }
    #camControls {
      position: absolute;
      top: 50px;
      right: 20px;
      background: rgba(0,0,0,0.75);
      border: 1px solid #3a2a18;
      padding: 12px 16px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #a08060;
      letter-spacing: 1px;
      line-height: 2;
    }
    #camControls label { display: flex; align-items: center; gap: 8px; }
    #camControls input[type=range] { width: 120px; accent-color: #a08060; }
    #camControls span.val { display: inline-block; width: 42px; text-align: right; color: #ffe8b0; }
    #vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.75) 100%);
    }
  </style>
</head>
<body>
<div id="counter">FRAME <span id="fc">001</span> / 50</div>
<div id="vignette"></div>
<div id="ui">→ KEY OR SCROLL</div>

<div id="camControls">
  CAM DEBUG<br>
  <label>r    <input type="range" id="camR"    min="0.5" max="20"   step="0.1"  value="2.5">   <span class="val" id="camR_v">  2.5</span></label>
  <label>elev <input type="range" id="camElev" min="-90" max="90"   step="0.5"  value="90">   <span class="val" id="camElev_v"> 90°</span></label>
  <label>azim <input type="range" id="camAzim" min="-180" max="180" step="0.5"  value="0">    <span class="val" id="camAzim_v">  0°</span></label>
  <label>FOV  <input type="range" id="fov"     min="1"  max="90"   step="1"    value="13">   <span class="val" id="fov_v">   13</span></label>
  <br>BEND DEBUG<br>
  <label>bend  <input type="range" id="bend"     min="0"  max="90" step="0.5"  value="70">   <span class="val" id="bend_v">  70°</span></label>
  <label>appr  <input type="range" id="approach" min="1"  max="30" step="1"    value="30">   <span class="val" id="approach_v">  30</span></label>
  <label>rels  <input type="range" id="release"  min="1"  max="30" step="1"    value="1">    <span class="val" id="release_v">   1</span></label>
  <label>shade <input type="range" id="shade"   min="0"  max="1"     step="0.01"  value="0.85"> <span class="val" id="shade_v">0.85</span></label>
  <label>speed <input type="range" id="speed"  min="0.0001" max="0.0005" step="0.00001" value="0.0005"> <span class="val" id="speed_v">0.0005</span></label>
  <label>keyfps <input type="range" id="keyfps" min="1" max="30" step="0.5" value="8"> <span class="val" id="keyfps_v"> 8fps</span></label>
  <label>thick  <input type="range" id="thick"  min="0.001" max="0.05" step="0.001" value="0.001"> <span class="val" id="thick_v">0.001</span></label>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const TOTAL  = 50;
const HUB_R  = 0.0415;                  // hub (drum core) radius
const CARD_W = 0.333;                   // along drum axis (X)
const CARD_H = CARD_W * (1012 / 1920); // radial height (extends outward from hub)
const R_CENTER = HUB_R + CARD_H / 2;   // card center radius
let THICKNESS = 0.001;                 // card edge thickness（スライダーで変更可能）

// ─── Scene ───────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0906);
scene.fog = new THREE.Fog(0x0c0906, 28, 65);

const camera = new THREE.PerspectiveCamera(10, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 5, 0.044);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

// ─── Lighting ────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x2a1a08, 2.5));

// Main lamp — illuminates the front viewing position (like the bulb inside the cabinet)
const lamp = new THREE.SpotLight(0xffe8b0, 8, 45, Math.PI / 7, 0.55);
lamp.position.set(1, 6, 9);
lamp.target.position.set(0, 2.03, 0);   // stopper at top (12 o'clock)
scene.add(lamp);
scene.add(lamp.target);

// Warm rim light from the side to show the wheel depth
const rimLight = new THREE.PointLight(0x301a06, 3, 30);
rimLight.position.set(10, 2, 0);
scene.add(rimLight);

// ─── Hub & Axle (static — not in drum group) ─────────────────
const metalMat = new THREE.MeshStandardMaterial({
  color: 0x1a0f05, metalness: 0.93, roughness: 0.15
});

// Hub: disc cylinder along X axis (radius matches HUB_R)
const hub = new THREE.Mesh(
  new THREE.CylinderGeometry(HUB_R, HUB_R, CARD_W * 1.2, 64),
  metalMat
);
hub.rotation.z = Math.PI / 2;
scene.add(hub);

// Axle rods extending beyond the hub
[-1, 1].forEach(dir => {
  const rod = new THREE.Mesh(
    new THREE.CylinderGeometry(0.1, 0.1, 4, 16),
    metalMat
  );
  rod.rotation.z = Math.PI / 2;
  rod.position.x = dir * (CARD_W * 0.7 + 2);
  scene.add(rod);
});

// ─── Cards (drum group rotates around X axis) ────────────────
// Drum axis = X. Cards radiate outward in YZ plane like gear teeth.
//
// For card at baseAngle:
//   position = (0, cos(baseAngle)*R_CENTER, -sin(baseAngle)*R_CENTER)
//   rotation.x = -baseAngle
//
// This makes card local-Y point radially outward (= the HEIGHT extends outward). ✓
// Card face (local-Z) points tangentially — sweeps past viewer as drum spins. ✓
// At baseAngle=0: card is at top (y=R_CENTER), face points +Z toward camera. ✓
const drum  = new THREE.Group();
scene.add(drum);

const loader = new THREE.TextureLoader();

// cards配列にmeshとbaseAngleを保存（たわみアニメーション用）
const cards = [];

for (let i = 0; i < TOTAL; i++) {
  const baseAngle = (i / TOTAL) * Math.PI * 2;
  const mGeo = (zOffset) => {
    const g = new THREE.PlaneGeometry(CARD_W, CARD_H, 1, 16);
    g.attributes.position.usage = THREE.DynamicDrawUsage;
    // 初期Z位置をオフセット（直線状態）
    const pa = g.attributes.position;
    for (let j = 0; j < pa.count; j++) pa.setZ(j, zOffset);
    pa.needsUpdate = true;
    return g;
  };

  const pos = { x: 0, y: Math.cos(baseAngle) * R_CENTER, z: -Math.sin(baseAngle) * R_CENTER };

  // 表面：画像テクスチャ（FrontSide） — 前面(Z=0)
  const frontMat  = new THREE.MeshBasicMaterial({ color: 0x080808, side: THREE.FrontSide });
  const frontMesh = new THREE.Mesh(mGeo(0), frontMat);
  frontMesh.position.set(pos.x, pos.y, pos.z);
  frontMesh.rotation.x = -baseAngle;
  frontMesh.userData.wasBent = false;
  drum.add(frontMesh);

  // 裏面：back.jpg（BackSide）— 背面(Z=-THICKNESS)
  const backMat  = new THREE.MeshBasicMaterial({ color: 0x666666, side: THREE.BackSide });
  const backMesh = new THREE.Mesh(mGeo(-THICKNESS), backMat);
  backMesh.position.set(pos.x, pos.y, pos.z);
  backMesh.rotation.x = -baseAngle;
  drum.add(backMesh);

  // 左右エッジ（ベンドに追従する側面）
  const edgeMaker = () => {
    const eg = new THREE.PlaneGeometry(THICKNESS, CARD_H, 1, 16);
    eg.attributes.position.usage = THREE.DynamicDrawUsage;
    const em = new THREE.Mesh(eg, new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
    em.position.set(pos.x, pos.y, pos.z);
    em.rotation.x = -baseAngle;
    drum.add(em);
    return em;
  };
  const leftEdge  = edgeMaker();
  const rightEdge = edgeMaker();

  // 上下キャップ（手前面と奥面をつなぐ平行四辺形）
  // PlaneGeometry(CARD_W, THICKNESS, 1, 1) の4頂点を手動で配置
  // 頂点順: j=0(-W/2, top), j=1(+W/2, top), j=2(-W/2, bottom), j=3(+W/2, bottom)
  const capMaker = (y, z) => {
    const cg = new THREE.PlaneGeometry(CARD_W, THICKNESS, 1, 1);
    cg.attributes.position.usage = THREE.DynamicDrawUsage;
    const pa = cg.attributes.position;
    pa.setXYZ(0, -CARD_W / 2, y, z);
    pa.setXYZ(1,  CARD_W / 2, y, z);
    pa.setXYZ(2, -CARD_W / 2, y, z - THICKNESS);
    pa.setXYZ(3,  CARD_W / 2, y, z - THICKNESS);
    pa.needsUpdate = true;
    const cm = new THREE.Mesh(cg, new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
    cm.position.set(pos.x, pos.y, pos.z);
    cm.rotation.x = -baseAngle;
    drum.add(cm);
    return cm;
  };
  const botCap = capMaker(-CARD_H / 2, 0); // 根元（固定）
  const topCap = capMaker( CARD_H / 2, 0); // 先端（ベンドで動く）

  cards.push({ mesh: frontMesh, backMesh, leftEdge, rightEdge, botCap, topCap, baseAngle });

  const num = String(i + 1).padStart(4, '0');
  loader.load(`frames/frame_${num}.jpg`, tex => {
    // 白黒変換：Imageをcanvasに描画してgrayscaleフィルタを適用
    const img = tex.image;
    const cvs = document.createElement('canvas');
    cvs.width = img.width; cvs.height = img.height;
    const ctx = cvs.getContext('2d');
    ctx.filter = 'grayscale(1) contrast(1.4)';
    ctx.drawImage(img, 0, 0);
    const bwTex = new THREE.CanvasTexture(cvs);
    frontMesh.material = new THREE.MeshBasicMaterial({ map: bwTex, side: THREE.FrontSide });
  });
}

// 裏面テクスチャ（back.jpg）を一度だけ読み込み、全カードに適用
loader.load('back.jpg', tex => {
  const img = tex.image;
  const cvs = document.createElement('canvas');
  cvs.width = img.width; cvs.height = img.height;
  const ctx = cvs.getContext('2d');
  ctx.filter = 'grayscale(1) contrast(1.4)';
  ctx.drawImage(img, 0, 0);
  const bwTex = new THREE.CanvasTexture(cvs);
  cards.forEach(({ backMesh }) => {
    backMesh.material = new THREE.MeshBasicMaterial({ map: bwTex, side: THREE.BackSide });
  });
});

// ─── Rotation control ────────────────────────────────────────
let targetAngle  = 0;
let currentAngle = 0;
const stepAngle  = (Math.PI * 2) / TOTAL;

// 一方向のみ：奥から手前（currentAngle が増加する方向）
let keyHeld = false;
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') keyHeld = true;
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowRight') keyHeld = false;
});
document.addEventListener('wheel', e => {
  if (e.deltaY > 0) targetAngle += e.deltaY * bendState.speed;
}, { passive: true });

let touchStartY = 0;
document.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; });
document.addEventListener('touchmove', e => {
  const dy = e.touches[0].clientY - touchStartY;
  if (dy > 0) targetAngle += dy * bendState.speed;
  touchStartY = e.touches[0].clientY;
});

// ─── Camera debug controls ────────────────────────────────────
const camState  = { r: 2.5, elev: 90, azim: 0 };
const bendState = { maxBend: 70, approach: 30, release: 1, shade: 0.85, speed: 0.0005, keyFps: 8 };

function bindSlider(id, key, suffix) {
  const el  = document.getElementById(id);
  const vEl = document.getElementById(id + '_v');
  el.addEventListener('input', () => {
    camState[key] = parseFloat(el.value);
    vEl.textContent = camState[key].toFixed(1) + (suffix || '');
  });
}
bindSlider('camR',    'r');
bindSlider('camElev', 'elev', '°');
bindSlider('camAzim', 'azim', '°');

document.getElementById('fov').addEventListener('input', e => {
  const v = parseFloat(e.target.value);
  document.getElementById('fov_v').textContent = v.toFixed(0);
  camera.fov = v;
  camera.updateProjectionMatrix();
});

document.getElementById('bend').addEventListener('input', e => {
  bendState.maxBend = parseFloat(e.target.value);
  document.getElementById('bend_v').textContent = bendState.maxBend.toFixed(1) + '°';
});
document.getElementById('approach').addEventListener('input', e => {
  bendState.approach = parseInt(e.target.value);
  document.getElementById('approach_v').textContent = bendState.approach;
});
document.getElementById('release').addEventListener('input', e => {
  bendState.release = parseInt(e.target.value);
  document.getElementById('release_v').textContent = bendState.release;
});
document.getElementById('shade').addEventListener('input', e => {
  bendState.shade = parseFloat(e.target.value);
  document.getElementById('shade_v').textContent = bendState.shade.toFixed(2);
});
document.getElementById('speed').addEventListener('input', e => {
  bendState.speed = parseFloat(e.target.value);
  document.getElementById('speed_v').textContent = bendState.speed.toFixed(4);
});
document.getElementById('keyfps').addEventListener('input', e => {
  bendState.keyFps = parseFloat(e.target.value);
  document.getElementById('keyfps_v').textContent = bendState.keyFps.toFixed(1) + 'fps';
});
document.getElementById('thick').addEventListener('input', e => {
  THICKNESS = parseFloat(e.target.value);
  document.getElementById('thick_v').textContent = THICKNESS.toFixed(3);
  // 直線状態のカードも次フレームで更新されるよう wasBent フラグをリセット
  cards.forEach(c => { c.mesh.userData.wasBent = true; });
});

// ─── Render loop ─────────────────────────────────────────────
const fcEl = document.getElementById('fc');
// キー押し続け時の速度は bendState.keyFps で管理
let lastTime = 0;
let azimNoise = 0; // スムーズなランダムノイズ（フレーム間で減衰）

function animate(timestamp) {
  requestAnimationFrame(animate);

  const dt = Math.min((timestamp - lastTime) / 1000, 0.1);  // 秒（最大0.1で異常値を除外）
  lastTime = timestamp;

  if (keyHeld) targetAngle += stepAngle * bendState.keyFps * dt;

  currentAngle += (targetAngle - currentAngle) * 0.12;
  drum.rotation.x = currentAngle;

  // azim ジッター：複数の正弦波 ＋ スムーズなランダムノイズで古い機械のガタつき感を演出
  // 各周波数は互いに素に近い値で非周期的なパターンを生成、合計±1°以内
  const mechWobble = Math.sin(currentAngle * 3.7) * 0.45
                   + Math.sin(currentAngle * 11.3 + 1.2) * 0.30
                   + Math.sin(currentAngle * 19.7 + 2.8) * 0.15;
  azimNoise += (Math.random() - 0.5) * 0.3;
  azimNoise *= 0.82; // 減衰して滑らかに
  const azimJitter = mechWobble + azimNoise * 0.1; // 合計 ≈ ±1°

  const elevRad = camState.elev * Math.PI / 180;
  const azimRad = (camState.azim + azimJitter) * Math.PI / 180;
  camera.position.x = camState.r * Math.cos(elevRad) * Math.sin(azimRad);
  camera.position.y = camState.r * Math.sin(elevRad);
  camera.position.z = camState.r * Math.cos(elevRad) * Math.cos(azimRad);
  camera.lookAt(0, 0, 0);

  // ─── カードのたわみアニメーション ──────────────────────────────
  // 回転方向：奥から手前（worldAngle が減少する向き）
  // ストッパー = 頂点（worldAngle = 0）
  // 接近ゾーン: worldAngle が APPROACH → 0 へ減少中（ストッパーに向かう）
  // 解放ゾーン: worldAngle が 2π 付近（ストッパー通過直後、ラップアラウンド）
  const APPROACH = bendState.approach * stepAngle;
  const RELEASE  = bendState.release  * stepAngle;
  const MAX_BEND = bendState.maxBend;
  const TWO_PI   = Math.PI * 2;
  const SEG      = 16;             // PlaneGeometry heightSegments
  const segLen   = CARD_H / SEG;

  // 左右エッジ頂点を更新するヘルパー（front/back それぞれ別配列）
  const updateEdge = (edge, xPos, fY, fZ, bY, bZ) => {
    const ep = edge.geometry.attributes.position;
    for (let j = 0; j < ep.count; j++) {
      const r = SEG - Math.floor(j / 2);
      ep.setX(j, xPos);
      if (j % 2 === 1) { ep.setY(j, bY[r]); ep.setZ(j, bZ[r]); } // 内側=背面
      else              { ep.setY(j, fY[r]); ep.setZ(j, fZ[r]); } // 外側=前面
    }
    ep.needsUpdate = true;
  };

  // 上下キャップ頂点を更新するヘルパー（前面側と背面側を個別に指定）
  const updateCap = (cap, fy, fz, by, bz) => {
    const pa = cap.geometry.attributes.position;
    pa.setXYZ(0, -CARD_W / 2, fy, fz);
    pa.setXYZ(1,  CARD_W / 2, fy, fz);
    pa.setXYZ(2, -CARD_W / 2, by, bz);
    pa.setXYZ(3,  CARD_W / 2, by, bz);
    pa.needsUpdate = true;
  };

  cards.forEach(({ mesh, backMesh, leftEdge, rightEdge, botCap, topCap, baseAngle }) => {
    const worldAngle = ((baseAngle - currentAngle) % TWO_PI + TWO_PI) % TWO_PI;

    // 前後4枚の範囲でシェーディング（それ以上は最暗値で固定）
    const dist    = Math.min(worldAngle, TWO_PI - worldAngle);
    const maxDist = 4 * stepAngle;
    const t       = Math.min(dist / maxDist, 1);
    const shade   = 1 - Math.sqrt(t) * bendState.shade;
    mesh.material.color.setScalar(shade);
    backMesh.material.color.setScalar(shade);
    leftEdge.material.color.setScalar(shade * 0.7);
    rightEdge.material.color.setScalar(shade * 0.7);
    botCap.material.color.setScalar(shade * 0.7);
    topCap.material.color.setScalar(shade * 0.7);

    const inApproach = worldAngle > 0 && worldAngle <= APPROACH;
    const inRelease  = worldAngle > TWO_PI - RELEASE;

    if (!inApproach && !inRelease) {
      if (mesh.userData.wasBent) {
        // 前面リセット（Z=0）
        const pos = mesh.geometry.attributes.position;
        for (let j = 0; j < pos.count; j++) {
          pos.setZ(j, 0);
          pos.setY(j, CARD_H / 2 - Math.floor(j / 2) * segLen);
        }
        pos.needsUpdate = true;
        // 背面リセット（Z=-THICKNESS）
        const bpos = backMesh.geometry.attributes.position;
        for (let j = 0; j < bpos.count; j++) {
          bpos.setZ(j, -THICKNESS);
          bpos.setY(j, CARD_H / 2 - Math.floor(j / 2) * segLen);
        }
        bpos.needsUpdate = true;
        // 左右エッジもリセット（phi=0 なので背面は Y 変化なし、Z=-THICKNESS）
        const sY = new Float32Array(SEG + 1);
        const sZ = new Float32Array(SEG + 1);
        const sbY = new Float32Array(SEG + 1);
        const sbZ = new Float32Array(SEG + 1);
        for (let r = 0; r <= SEG; r++) {
          sY[r] = -CARD_H / 2 + r * segLen; sZ[r] = 0;
          sbY[r] = sY[r]; sbZ[r] = -THICKNESS;
        }
        updateEdge(leftEdge,  -CARD_W / 2, sY, sZ, sbY, sbZ);
        updateEdge(rightEdge,  CARD_W / 2, sY, sZ, sbY, sbZ);
        // 上下キャップもリセット
        updateCap(topCap, CARD_H / 2, 0, CARD_H / 2, -THICKNESS);
        updateCap(botCap, -CARD_H / 2, 0, -CARD_H / 2, -THICKNESS);
        mesh.userData.wasBent = false;
      }
      return;
    }

    mesh.userData.wasBent = true;
    const pos = mesh.geometry.attributes.position;

    // 傾き量（度 → ラジアン）を計算
    let phi;
    if (inApproach) {
      const phase = (APPROACH - worldAngle) / APPROACH;   // 0→1
      phi = MAX_BEND * phase * Math.PI / 180;
    } else {
      const tr = (TWO_PI - worldAngle) / RELEASE;          // 0→1
      phi = MAX_BEND * Math.exp(-tr * 5) * Math.cos(tr * Math.PI * 3) * Math.PI / 180;
    }

    // チェーン法：根元からの剛体回転 phi ＋ 先端に向かって小さな丸みを追加
    // theta(t) = phi * (1 + 0.3*t)
    //   → 根元では phi だけ傾く、先端では phi*1.3 まで緩やかに増える
    const rowY = new Float32Array(SEG + 1);
    const rowZ = new Float32Array(SEG + 1);
    rowY[0] = -CARD_H / 2;
    rowZ[0] = 0;
    for (let r = 0; r < SEG; r++) {
      const t_mid = (r + 0.5) / SEG;
      const theta  = phi * (1 + 0.3 * t_mid);             // 根元: phi、先端: phi*1.3（少し丸み）
      rowY[r + 1] = rowY[r] + segLen * Math.cos(theta);
      rowZ[r + 1] = rowZ[r] - segLen * Math.sin(theta);   // 奥側（−Z）へ
    }

    // 頂点に適用（j=0,1 が先端、j=32,33 が根元）
    for (let j = 0; j < pos.count; j++) {
      const r = SEG - Math.floor(j / 2);
      pos.setY(j, rowY[r]);
      pos.setZ(j, rowZ[r]);           // 前面：カーブのZ
    }
    pos.needsUpdate = true;

    // 背面：カード面の法線方向（ベンド角度に依存）に THICKNESS 分オフセット
    // 各行 r での法線方向: (−sin(theta_r), −cos(theta_r)) in YZ
    const backY = new Float32Array(SEG + 1);
    const backZ = new Float32Array(SEG + 1);
    for (let r = 0; r <= SEG; r++) {
      const theta_r = phi * (1 + 0.3 * r / SEG);
      backY[r] = rowY[r] - THICKNESS * Math.sin(theta_r);
      backZ[r] = rowZ[r] - THICKNESS * Math.cos(theta_r);
    }

    const bpos = backMesh.geometry.attributes.position;
    for (let j = 0; j < bpos.count; j++) {
      const r = SEG - Math.floor(j / 2);
      bpos.setY(j, backY[r]);
      bpos.setZ(j, backZ[r]);
    }
    bpos.needsUpdate = true;

    // 左右エッジ：前面=rowY/rowZ、背面=backY/backZ
    updateEdge(leftEdge,  -CARD_W / 2, rowY, rowZ, backY, backZ);
    updateEdge(rightEdge,  CARD_W / 2, rowY, rowZ, backY, backZ);
    // キャップ：前面と背面の対応する端点を結ぶ
    updateCap(topCap, rowY[SEG], rowZ[SEG], backY[SEG], backZ[SEG]);
    updateCap(botCap, rowY[0],   rowZ[0],   backY[0],   backZ[0]);
  });

  // ストッパー位置（頂点）にいるカードのフレーム番号
  const norm = (currentAngle % TWO_PI + TWO_PI) % TWO_PI;
  const f = Math.round(norm / stepAngle) % TOTAL;
  fcEl.textContent = String(f + 1).padStart(3, '0');

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
